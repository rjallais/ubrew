name: CI

on:
  push:
    branches: [main, ubrew]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4

      - name: Cache SQLite amalgamation
        id: cache-sqlite
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/sqlite-amalgamation
          key: sqlite-3.49.1-${{ runner.os }}

      - name: Build libsqlite3-fts5 (via mise task)
        run: mise run build-libsqlite

      - name: Build ubrew
        run: |
          case "$(uname -s)" in
            Darwin) ext=dylib ;;
            *)      ext=so    ;;
          esac
          odin build src -out:ubrew -define:SQLITE3_CUSTOM_FTS5=true -o:speed
          cp "src/vendor/odin-sqlite3/libsqlite3-fts5.${ext}" .

      - name: Verify binary
        run: |
          chmod +x ubrew
          file ubrew
          ls -lh ubrew

      - name: Pre-test Setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo mkdir -p /opt/ubrew
          sudo chown -R $USER /opt/ubrew
          ./ubrew tap trust ublue-os/tap || exit 1
          ./ubrew tap trust justrach/nanobrew || exit 1
          echo "/opt/ubrew/prefix/bin" >> $GITHUB_PATH

      - name: Run unit tests
        run: odin test src -define:SQLITE3_CUSTOM_FTS5=true

      - name: Run smoke tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tests/smoke-test.sh ./ubrew
