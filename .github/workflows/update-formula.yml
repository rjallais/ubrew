name: Update Formula (manual dispatch)

# Manual companion to release.yml. The automated release workflow
# (release.yml) bumps Formula/ubrew.rb for stable tags automatically, so
# this exists for the window where the previous auto-bump missed a release
# or where macOS artifacts were uploaded after the fact:
#
#   1. The release must already exist on GitHub with its assets uploaded
#      (ubrew-linux-x86_64.tar.gz, and optionally the macOS tarballs).
#   2. Run this workflow with the release tag; it downloads the assets,
#      rewrites Formula/ubrew.rb via scripts/update-formula.sh, verifies
#      the SHA256s, and opens a formula PR.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bump the formula to (e.g. v2026.8.1)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG}"
          TAG="${TAG#refs/tags/}"
          VERSION="${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: '$TAG' does not match calendar SemVer (vYYYY.M.PATCH[-suffix])" >&2
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            echo "ERROR: prerelease tags ($TAG) never get formula bumps" >&2
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern 'ubrew-linux-x86_64.tar.gz' \
            --dir artifacts || { echo "linux asset missing" >&2; exit 1; }
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern 'ubrew-arm64-apple-darwin.tar.gz' \
            --dir artifacts || true
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern 'ubrew-x86_64-apple-darwin.tar.gz' \
            --dir artifacts || true
          ls -la artifacts/

      - name: Rewrite Formula/ubrew.rb
        env:
          UBREW_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          export UBREW_LINUX_SHA256=$(sha256sum artifacts/ubrew-linux-x86_64.tar.gz | cut -d' ' -f1)
          if [ -f artifacts/ubrew-arm64-apple-darwin.tar.gz ]; then
            export UBREW_MACOS_ARM_SHA256=$(sha256sum artifacts/ubrew-arm64-apple-darwin.tar.gz | cut -d' ' -f1)
          fi
          if [ -f artifacts/ubrew-x86_64-apple-darwin.tar.gz ]; then
            export UBREW_MACOS_X86_SHA256=$(sha256sum artifacts/ubrew-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          fi
          bash scripts/update-formula.sh

      - name: Verify formula against release assets
        run: bash scripts/verify-formula-release.sh --local-dir artifacts Formula/ubrew.rb

      - name: Open formula PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          BRANCH="release/formula-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Formula/ubrew.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${TAG}"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git commit -m "formula: update to ${TAG}"
          git push -f origin "$BRANCH"

          existing_pr="$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "PR #$existing_pr already exists"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "formula: update to ${TAG}" \
            --body "Automated bump of Formula/ubrew.rb for release ${TAG} (manual dispatch; release assets may include macOS tarballs).

          Verified by scripts/verify-formula-release.sh. See docs/RELEASING.md."