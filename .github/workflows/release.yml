name: Release

# Tag-driven release pipeline using calendar SemVer (mise/Odin-style
# notation): pushing `vYYYY.M.PATCH` (e.g. v2026.8.1) triggers CI builds of
# the Linux x86_64 and macOS (arm64 + x86_64) release assets, publishes the
# GitHub Release with .sha256 sidecars, then bumps Formula/ubrew.rb (filling
# real on_macos SHA256 values) and opens a PR.
#
# macOS binaries are built on dedicated macOS runners (macos-14 is arm64,
# macos-13 is x86_64) and distributed unsigned for now; codesigning +
# notarization is planned but requires Apple Developer ID credentials.
#
# Tags containing a hyphen (e.g. v2026.8.1-rc.1) are treated as prereleases:
# the release is published with the prerelease flag and the formula bump is
# skipped, so stable Homebrew users never get pointed at a prerelease.
#
# See docs/RELEASING.md for the full flow.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  build-macos:
    name: build-macos (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each GitHub macOS runner has a fixed architecture.
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4

      - name: Cache SQLite amalgamation
        id: cache-sqlite
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/sqlite-amalgamation
          key: sqlite-3.49.1-${{ runner.os }}

      - name: Resolve version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: tag '$TAG' does not match calendar SemVer (vYYYY.M.PATCH[-suffix])" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build libsqlite3-fts5 (via mise task)
        run: mise run build-libsqlite

      - name: Build macOS release assets
        env:
          UBREW_VERSION: ${{ steps.tag.outputs.version }}
        run: bash scripts/build-release-assets.sh

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            build/release/ubrew-${{ matrix.arch }}-apple-darwin.tar.gz
            build/release/ubrew-${{ matrix.arch }}-apple-darwin.tar.gz.sha256
          if-no-files-found: error
  release:
    runs-on: ubuntu-latest
    needs: build-macos
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # Credentials must persist: the formula-PR step pushes a branch
        # and opens a PR with the job's GITHUB_TOKEN.

      - name: Set up mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4

      - name: Install patchelf (binary relinking)
        run: |
          if ! command -v patchelf >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
          fi
          patchelf --version

      - name: Cache SQLite amalgamation
        id: cache-sqlite
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/sqlite-amalgamation
          key: sqlite-3.49.1-${{ runner.os }}

      - name: Resolve version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # Calendar SemVer: vYYYY.M.PATCH, optional -prerelease suffix.
          if [[ ! "$TAG" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: tag '$TAG' does not match calendar SemVer (vYYYY.M.PATCH[-suffix])" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=1" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build libsqlite3-fts5 (via mise task)
        run: mise run build-libsqlite

      - name: Build Linux release assets
        env:
          UBREW_VERSION: ${{ steps.tag.outputs.version }}
        run: bash scripts/build-release-assets.sh

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/release
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ steps.tag.outputs.prerelease }}" == "1" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "ubrew $TAG" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
          # Idempotent upload so re-pushed tags refresh the assets.
          gh release upload "$TAG" \
            build/release/ubrew-linux-x86_64.tar.gz \
            build/release/ubrew-linux-x86_64.tar.gz.sha256 \
            build/release/ubrew-arm64-apple-darwin.tar.gz \
            build/release/ubrew-arm64-apple-darwin.tar.gz.sha256 \
            build/release/ubrew-x86_64-apple-darwin.tar.gz \
            build/release/ubrew-x86_64-apple-darwin.tar.gz.sha256 \
            --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'

      - name: Bump Formula/ubrew.rb (stable tags only)
        if: ${{ steps.tag.outputs.prerelease == '0' }}
        env:
          UBREW_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          export UBREW_MACOS_ARM_SHA256="$(cat build/release/ubrew-arm64-apple-darwin.tar.gz.sha256)"
          export UBREW_MACOS_X86_SHA256="$(cat build/release/ubrew-x86_64-apple-darwin.tar.gz.sha256)"
          bash scripts/update-formula.sh
          bash scripts/verify-formula-release.sh --local-dir build/release Formula/ubrew.rb

      - name: Open formula PR (stable tags only)
        if: ${{ steps.tag.outputs.prerelease == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          BRANCH="release/formula-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Formula/ubrew.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${TAG}"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git commit -m "formula: update to ${TAG}"
          git push -f origin "$BRANCH"

          existing_pr="$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "PR #$existing_pr already exists"
            exit 0
          fi

          # Creating the PR is best-effort: the formula branch is already
          # pushed, and some repos deny GITHUB_TOKEN the createPullRequest
          # permission. In that case finish green with clear instructions
          # instead of red-lighting an otherwise successful release.
          if ! gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "formula: update to ${TAG}" \
            --body "Automated bump of Formula/ubrew.rb after the GitHub Release for ${TAG} was published with the Linux x86_64 and macOS (arm64 + x86_64) tarballs and their SHA256 sidecars.

          Verified against the release assets by scripts/verify-formula-release.sh during the same run.

          Maintainers: do not bump the formula to a version without a matching release (see docs/RELEASING.md)." 2> /tmp/pr_create.err; then
            if grep -q "createPullRequest" /tmp/pr_create.err; then
              echo "::warning::GitHub Actions is not permitted to create pull requests in this repo (createPullRequest)."
              echo "::warning::The $BRANCH branch was pushed; open the PR manually:"
              echo "::warning::  gh pr create --base main --head $BRANCH --title 'formula: update to ${TAG}'"
              exit 0
            fi
            cat /tmp/pr_create.err >&2
            exit 1
          fi
