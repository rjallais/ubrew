[tools]
odin = "dev-2026-07a"

[env]
UBREW_TELEMETRY = "0" # Disable telemetry in development environments

[tasks.build-libsqlite]
description = "One-time build of libsqlite3-fts5 from the SQLite amalgamation (downloaded if not cached)"
run = """\
set -eu

case "$(uname -s)" in
  Darwin) ext=dylib ;;
  *)      ext=so    ;;
esac

CACHE=".cache/sqlite-amalgamation"
mkdir -p "$CACHE"

if [ ! -f "$CACHE/sqlite3.c" ]; then
  echo "Downloading SQLite amalgamation 3.49.1..."
  curl -fsSL "https://www.sqlite.org/2025/sqlite-amalgamation-3490100.zip" -o /tmp/sqlite-amalg.zip
  unzip -o -j /tmp/sqlite-amalg.zip "sqlite-amalgamation-3490100/sqlite3.c" "sqlite-amalgamation-3490100/sqlite3.h" -d "$CACHE"
  rm -f /tmp/sqlite-amalg.zip
  echo "Verifying SHA3-256 of sqlite3.c..."
  EXPECTED="22eab05c842463a3705c63922f12f68531200185ced510ed6aed2065ca44e816"
  ACTUAL=$(openssl dgst -sha3-256 "$CACHE/sqlite3.c" 2>/dev/null | awk '{print $NF}') || ACTUAL=""
  if [ "$ACTUAL" != "$EXPECTED" ]; then
    echo "ERROR: SHA3-256 mismatch for sqlite3.c"
    echo "  Expected: $EXPECTED"
    echo "  Actual:   $ACTUAL"
    rm -rf "$CACHE"
    exit 1
  fi
  echo "Checksum verified."
  echo "Cached to $CACHE/"
fi

cc -c -O2 -fPIC -w -DSQLITE_ENABLE_FTS5 "$CACHE/sqlite3.c" -o "$CACHE/sqlite3-fts5.o"
cc -shared "$CACHE/sqlite3-fts5.o" -o "src/vendor/odin-sqlite3/libsqlite3-fts5.${ext}"
if [ "$(uname -s)" = "Darwin" ]; then
  strip -x "src/vendor/odin-sqlite3/libsqlite3-fts5.${ext}"
else
  strip "src/vendor/odin-sqlite3/libsqlite3-fts5.${ext}"
fi
rm -f "$CACHE/sqlite3-fts5.o"
"""
outputs = ["src/vendor/odin-sqlite3/libsqlite3-fts5.so", "src/vendor/odin-sqlite3/libsqlite3-fts5.dylib"]

[tasks.build]
description = "Build ubrew with aggressive optimizations for the native CPU (fastest dev build, no LTO)"
run = '''
case "$(uname -s)" in
  Darwin) ext=dylib ;;
  *)      ext=so    ;;
esac
odin build src -out:ubrew -define:SQLITE3_CUSTOM_FTS5=true -o:aggressive -no-bounds-check -no-type-assert -disable-assert -microarch:native
cp "src/vendor/odin-sqlite3/libsqlite3-fts5.${ext}" .
'''
depends = ["build-libsqlite"]
sources = ["src/**/*.odin"]
outputs = ["ubrew"]

[tasks.build-portable]
description = "Build ubrew without CPU-specific optimizations (more portable binary)"
run = "odin build src -out:ubrew_portable -define:SQLITE3_CUSTOM_FTS5=true -o:speed -no-bounds-check"
depends = ["build-libsqlite"]
sources = ["src/**/*.odin"]
outputs = ["ubrew_portable"]

[tasks.build-prod]
description = "Build ubrew for production: aggressive native microarch opts + disabled assertions (slowest build, fastest binary)"
run = "odin build src -out:ubrew_prod -define:SQLITE3_CUSTOM_FTS5=true -o:aggressive -no-bounds-check -no-type-assert -disable-assert -microarch:native"
depends = ["build-libsqlite"]
sources = ["src/**/*.odin"]
outputs = ["ubrew_prod"]

[tasks.run]
description = "Run ubrew with arguments"
run = "./ubrew"
depends = ["build"]

[tasks.test]
description = "Run integration smoke tests"
run = "./tests/smoke-test.sh ./ubrew"
depends = ["build"]

[tasks.test-unit]
description = "Run Odin unit tests"
run = "odin test src -define:SQLITE3_CUSTOM_FTS5=true && odin test src/api -define:SQLITE3_CUSTOM_FTS5=true && odin test src/tap && odin test src/history && odin test src/store && odin test src/installer"
depends = ["build-libsqlite"]

[tasks.bench-install]
description = "Benchmark installs vs nb/brew (if present)"
run = "./bench/bench_pkgmgr.sh install tree"
depends = ["build"]

[tasks.bench-update]
description = "Benchmark update vs nb/brew (if present)"
run = "./bench/bench_pkgmgr.sh update"
depends = ["build"]

[tasks.bench-upgrade]
description = "Benchmark upgrade vs nb/brew (if present)"
run = "./bench/bench_pkgmgr.sh upgrade"
depends = ["build"]

[tasks.bench-all]
description = "Run the full benchmark suite (install + update + upgrade)"
run = "mise run bench-install && mise run bench-update && mise run bench-upgrade"
depends = ["build"]

[tasks.clean]
description = "Clean up compiler build artifacts"
run = "rm -f ubrew ubrew_portable ubrew_prod ubrew_dbg libsqlite3-fts5.so libsqlite3-fts5.dylib src/api/sqlite3-fts5.o src/api/sqlite3.o"

[tasks.check]
description = "Type check all Odin source files"
run = "odin check src -define:SQLITE3_CUSTOM_FTS5=true"
depends = ["build-libsqlite"]

[tasks.profile-build]
description = "Show compile-time stage timings for the current build configuration"
run = "odin build src -out:ubrew -define:SQLITE3_CUSTOM_FTS5=true -o:aggressive -no-bounds-check -no-type-assert -disable-assert -microarch:native -show-timings"
